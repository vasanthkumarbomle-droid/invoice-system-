name: LedgerFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Set up Deno for Edge Function type-checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check client document Edge Function
        run: deno check supabase/functions/quotation-workflow/index.ts
      - name: Type-check invoice reminder Edge Function
        run: deno check supabase/functions/gmail-invoice-reminders/index.ts
